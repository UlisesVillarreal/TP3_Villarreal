    <header>
        <h1 class="titulo">Galería Attack on Titan</h1>
        <h2 class="titulo"><strong>TITANES</strong></h2>
    </header>

    <main>
        <div id="carouselAOT" class="carousel slide w-25 mx-auto">
            
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselAOT"
                    data-bs-slide-to="0" class="active"></button>

                <button type="button" data-bs-target="#carouselAOT"
                    data-bs-slide-to="1"></button>

                <button type="button" data-bs-target="#carouselAOT"
                    data-bs-slide-to="2"></button>
            </div>

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="./Img/titan_ataque.webp"
                        class="d-block w-100"
                        alt="Titan de Ataque">
                </div>

                <div class="carousel-item">
                    <img src="./Img/titan_bestia.jpg"
                        class="d-block w-100"
                        alt="Titan Bestia">
                </div>

                <div class="carousel-item">
                    <img src="./Img/Titan_fundador.jpg"
                        class="d-block w-100"
                        alt="titan_ataque">
                </div>

            </div>

            <button class="carousel-control-prev"
                type="button"
                data-bs-target="#carouselAOT"
                data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>

            </button>

            <button class="carousel-control-next"
                type="button"
                data-bs-target="#carouselAOT"
                data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>

            </button>

        </div>
    </main>
