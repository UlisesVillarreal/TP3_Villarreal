<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="./Css/contacto.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
</head>
<body>
    <NAV class="navbar">
        <ul class="nav_links">
            <li><a href="./index.html">Inicio</a></li>
            <li><a href="./info.html">Info</a></li>
            <li><a href="./login.html" id="cerrar">Cerrar Sesión</a></li>
        </ul>

        <img src="./Img/aot-logo.png" alt="LogoAOT" class="logo">
    </NAV>

    <header > 
        <h1 class="titulo">Formulario</h2>
    </header>

    <main class="main">
        <form>
            <fieldset>
                <legend>Datos personales</legend>
                
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" class="input">
                
                <br><br>
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" class="input">

                <br><br>
                <label for="tel">telefono:</label>
                <input type="number" id="tel" name="tel" class="input">

                <br><br>
                <label for="pais"> País:</label>
                <select name="pais" id="pais" class="boton">
                    <option value="arg">Argentina</option>
                    <option value="bra">Brasil</option>
                    <option value="otro">Otro</option>
                </select>
                <br><br>

                <p>Género: </p>
                <div class="form-check">
                <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
                <label class="form-check-label" for="radioDefault1">
                    Hombre
                </label>
                </div>
                <div class="form-check">
                <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" checked>
                <label class="form-check-label" for="radioDefault2">
                    Mujer
                </label>
                </div>
                <div class="form-check">
                <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" checked>
                <label class="form-check-label" for="radioDefault2">
                    Terian
                </label>
                </div>
            </fieldset>
            <fieldset>
                <legend> 
                    Intereses
                </legend>
                <input type="checkbox" id="anime"   >
                <label for="anime">Anime
                </label>

                <input type="checkbox" id="juegos">
                <label for="juegos">
                    Juegos
                </label>
                
                <input type="checkbox" id="series">
                <label for="series">
                    Series
                </label>
            </fieldset>

            <fieldset>
                <legend> Opiniones: </legend>
                <label for="mensaje"> Ingresar una opinion sobre la serie: </label><br>
                <textarea id="mensaje" name="mensaje" class="opinion"></textarea>

            </fieldset>
            <fieldset>
                <legend> Ingresar cuenta</legend>
                <label for="email">Email: </label>
                <input type="email" id="email" name="email" class="input"> 

                <br><br>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" class="input">

            </fieldset>
            
            <br>
            <input type="submit" value="Enviar Formulario" class="input">
            <br><br>
        </form>
    </main>

    <footer class="footer">

        <p>- Mas informacion en <a href="https://attackontitan.fandom.com/wiki/Attack_on_Titan_Wiki">Wiki AOT</a></p>
        <p>&copy;2026 Villarreal Ulises | Salta</p>

    </footer>
        

</body>
</html>
